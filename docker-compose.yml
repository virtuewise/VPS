services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: virtuewise-vps-api
    ports:
      - "8000:8000"
    environment:
      VPS_APP_ROOT: /app
      VPS_DATABASE_PATH: /data/virtuewise-vps.db
      VPS_ENV: development
      # Agent connection is intentionally opt-in. See docs/CONTROL-PLANE-AGENT.md.
      VPS_AGENT_URL: ${VPS_AGENT_URL:-}
      VPS_AGENT_TOKEN: ${VPS_AGENT_TOKEN:-}
    volumes:
      - vps-data:/data
    restart: unless-stopped

volumes:
  vps-data:
