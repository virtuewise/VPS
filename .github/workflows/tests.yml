name: Test suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            agent/requirements.txt
            mcp-server/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r agent/requirements.txt
      - name: Install MCP server
        run: python -m pip install -e ./mcp-server
      - name: Test node agent and provider SDK
        working-directory: agent
        run: python -m unittest discover -s tests -v
      - name: Test control plane
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Test MCP server
        run: python -m unittest discover -s mcp-server/tests -v
      - name: Validate Python syntax
        run: python -m compileall -q backend/app agent/app mcp-server/virtuewise_mcp
      - name: Validate frontend JavaScript
        run: node --check frontend/app.js && node --check frontend/developers.js
